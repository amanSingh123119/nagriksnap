version: "3.8"

services:
  nagriksnap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nagriksnap-app
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - backend/.env
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
