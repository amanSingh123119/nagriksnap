# Production Nginx Reverse Proxy Configuration for NagrikSnap
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    server {
        listen 80;
        server_name nagriksnap.org www.nagriksnap.org;

        # Redirect HTTP to HTTPS in production
        # return 301 https://$host$request_uri;

        # Client body limit for evidence photo/video uploads (50MB)
        client_max_body_size 50M;

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for realtime updates
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Cache static assets
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2|woff)$ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }
    }
}
